appId: dev.bawkterm
productName: bawkterm
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # node-pty ships its sources, debug symbols and every platform's binaries; each build keeps only what runs
  - '!**/node_modules/node-pty/{src,deps,third_party,scripts,typings,binding.gyp}'
  - '!**/node_modules/node-pty/**/*.{pdb,map,o,mk,gypi}'
  - '!**/node_modules/node-pty/lib/**/*.test.js'
  - '!**/node_modules/node-pty/build/{Makefile,Release/obj.target,Release/.deps,Release/obj}'
asar: true
# native binaries, and the worker script node-pty starts on Windows, cannot run from inside app.asar
asarUnpack:
  - '**/node_modules/node-pty/**'
# lock the shipped binary down: no running as plain Node, no inspector, no NODE_OPTIONS, and only the packaged app.asar (hash-checked)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
# where the built-in updater looks for new versions; builds still run with --publish never
publish:
  provider: github
  owner: juddisjudd
  repo: bawkterm
  releaseType: release
win:
  files:
    - '!**/node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**'
    # the bundled conpty.dll only runs with useConptyDll, which bawkterm leaves off in favor of the one in Windows
    - '!**/node_modules/node-pty/{build/Release,prebuilds/win32-x64}/conpty/**'
  icon: build/icon.ico
  extraResources:
    - from: build/icon.ico
      to: icon.ico
    - from: build/icon-light.ico
      to: icon-light.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
mac:
  files:
    - '!**/node_modules/node-pty/prebuilds/win32-*/**'
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # ad-hoc signed, not notarized: enough to run on Apple silicon, but Gatekeeper asks once and updates stay manual
  identity: '-'
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  # node-pty has no Linux prebuilds; bun install compiles it into build/Release
  files:
    - '!**/node_modules/node-pty/prebuilds/**'
  icon: build/icon.png
  appId: net.bawkbawk.bawkterm
  executableName: bawkterm
  syncDesktopName: true
  category: Network
  synopsis: SSH, SFTP, Docker and Remote Desktop client with an encrypted vault
  maintainer: juddisjudd <juddisjudd@users.noreply.github.com>
  vendor: juddisjudd
  extraResources:
    - from: build/icon.png
      to: icon.png
    - from: build/icon-light.png
      to: icon-light.png
  desktop:
    entry:
      StartupWMClass: bawkterm
      Keywords: ssh;sftp;terminal;rdp;docker;
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
    - flatpak
deb:
  recommends:
    - freerdp3-x11
    - gnome-keyring
rpm:
  fpm: ['--rpm-rpmbuild-define=_build_id_links none']
flatpak:
  license: LICENSE
  runtimeVersion: '25.08'
  baseVersion: '25.08'
  finishArgs:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    - --share=network
    # the local SFTP pane browses your files
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
    # auto-unlock keeps the vault key in the system keyring
    - --talk-name=org.freedesktop.secrets
    - --talk-name=org.kde.kwalletd5
    - --talk-name=org.kde.kwalletd6
    # SSH agent authentication
    - --socket=ssh-auth
